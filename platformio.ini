[env:lolin32]
; 6.x ships Arduino-ESP32 core 2.0.x (the task-watchdog API in main.cpp depends on it)
platform = espressif32 @ ^6.12.0
board = lolin32
framework = arduino
monitor_speed = 115200
; Don't reset the board when the serial monitor opens: a reset within 3 s of the post-upload
; reset would be detected as a double reset and open the Wi-Fi config portal.
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600

; Persoboard device id. Its credentials are read from certs/devices/<id>/secrets.h (git-ignored),
; generated on the Persoboard side with: python scripts/pki.py device <id>
custom_pb_device = bedroom-esp32

build_flags =
    -I inc
    -I certs/devices/${this.custom_pb_device}
    -Wl,-gc-sections
    ; release build: no ESP-IDF / Arduino core log output
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    https://github.com/tzapu/WiFiManager.git
    boschsensortec/BSEC Software Library @ ^1.8.1492
