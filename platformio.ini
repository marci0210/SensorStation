[env:lolin32]
; 6.x ships Arduino-ESP32 core 2.0.x (the task-watchdog API in main.cpp depends on it)
platform = espressif32 @ ^6.12.0
board = lolin32
framework = arduino
monitor_speed = 115200
; Don't reset the board when the serial monitor opens: a reset within 3 s of the post-upload
; reset would be detected as a double reset and open the Wi-Fi config portal.
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600
build_flags =
    -I inc
    -Wl,-gc-sections
    -D USE_WIFI_NINA=false
    -D USE_WIFI_CUSTOM=false
lib_deps =
    khoih-prog/MySQL_MariaDB_Generic @ ^1.7.2
    https://github.com/tzapu/WiFiManager.git
    boschsensortec/BSEC Software Library @ ^1.8.1492

lib_ignore =
    ESP8266_AT_WebServer
    UIPEthernet
    WiFiNINA_Generic
    WiFi101_Generic
    WiFiEspAT
    WiFiNINA
    WiFi101

; This forces the compiler to resolve dependencies correctly
lib_ldf_mode = chain+
